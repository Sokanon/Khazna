    <!-- FOUC prevention: apply theme + language before paint -->
    <script>
      (() => {
        var theme = localStorage.getItem('khazna-theme');
        if (!theme) {
          theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        var lang = localStorage.getItem('khazna-lang') || 'ar';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        // The status bar follows the in-app theme, not only the OS one. The installed iOS app
        // ignores theme-color and only reads its own style at launch, so that's set here too.
        document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => {
          meta.setAttribute('content', theme === 'dark' ? '#080808' : '#ffffff');
        });
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          ?.setAttribute('content', theme === 'dark' ? 'black' : 'default');
        if (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
          document.documentElement.classList.add('is-standalone');
        }
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
